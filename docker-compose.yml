# Local development stack for the Community platform.
# M1-01 defines the intended four-service topology. The frontend/api/worker
# Dockerfiles are created by later milestone issues (M1-02 backend, M1-04
# frontend); this file only needs `docker compose config` to validate.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # PostgreSQL is intentionally NOT published to the host by default.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    # Development hot reload: uvicorn watches the bind-mounted source. The
    # image installs its virtualenv at /opt/venv (outside /app), so mounting
    # ./backend over /app does not shadow installed dependencies.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"

  worker:
    # api and worker share the backend image/codebase with different commands.
    # Worker runtime behavior is introduced in M1-11. Until then the service is
    # defined for the topology but is not started by default (see `make up`).
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT}:5173"

volumes:
  db-data:
